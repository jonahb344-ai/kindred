name: kindred_app
description: "A new Flutter project."
publish_to: 'none'

version: 0.6.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.3
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.12
  image_picker: ^1.2.2
  firebase_storage: ^12.4.10
  http: ^1.6.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  firebase_messaging: ^15.2.10
  qr_flutter: ^4.1.0
  package_info_plus: ^10.1.0
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/neighborhood.jpg
    - assets/volunteers.jpg
    - assets/cleanup.jpg
    - assets/logo_banner.png
    - assets/logo_banner_login.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#081A31"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_monochrome: "assets/icon/app_icon.png"