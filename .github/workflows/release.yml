name: Auto Release

# Publishes a GitHub release (unsigned IPA) automatically using the built-in
# GITHUB_TOKEN, so no personal token or repository secrets are needed.
# Triggered by pushing a version tag, e.g.:
#   git tag v0.6.9 && git push origin v0.6.9
#
# The .ipa is unsigned (re-signed by AltStore/Sideloadly at install) and is what
# the AltStore source (https://kindred.jonahb344.workers.dev/altstore.json)
# points at for iPhone installs.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from pubspec
        run: |
          echo "VERSION=$(sed -nE 's/^version: ([0-9.]+).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Strip Mac-only dependency overrides
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          s = re.sub(r'(?ms)^dependency_overrides:.*?(?=^\S)', '', s)
          p.write_text(s)
          assert 'dependency_overrides' not in s, 'failed to strip overrides'
          PY

      - name: Fresh pods
        run: rm -rf ios/Pods ios/Podfile.lock

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -eux
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry Kindred-${{ env.VERSION }}-unsigned.ipa Payload
          ls -la Kindred-${{ env.VERSION }}-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kindred-unsigned-ipa
          path: build/ios/iphoneos/Kindred-${{ env.VERSION }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: ios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release names
        run: |
          VERSION=$(sed -nE 's/^version: ([0-9.]+).*/\1/p' pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=v$VERSION
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Kindred-unsigned-ipa
          path: Kindred-unsigned-ipa

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Kindred ${{ env.TAG }}
          body: |
            Automatic release built by GitHub Actions.

            - **iOS**: `Kindred-${{ env.VERSION }}-unsigned.ipa` — sideload with AltStore/Sideloadly (unsigned by design; AltStore signs it on install). Refresh via the AltStore source at `https://kindred.jonahb344.workers.dev/altstore.json`.
          files: |
            Kindred-unsigned-ipa/Kindred-${{ env.VERSION }}-unsigned.ipa
          fail_on_unmatched_files: true