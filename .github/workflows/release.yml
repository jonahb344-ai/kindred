name: Auto Release

# Publishes a GitHub release (signed APK + unsigned IPA) automatically using the
# built-in GITHUB_TOKEN, so no personal token is needed. Triggered by pushing a
# version tag, e.g.:
#   git tag v0.6.9 && git push origin v0.6.9
#
# The APK is signed with the production keystore, supplied once via repository
# secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64     base64 -i android/app/upload-keystore.jks | tr -d '\n'
#   KEYSTORE_PASSWORD   value of storePassword in android/key.properties
#   KEY_PASSWORD        value of keyPassword   in android/key.properties
#   KEY_ALIAS           value of keyAlias      in android/key.properties  (usually "upload")
#
# The `ios_appstore` job additionally builds a SIGNED App Store IPA and (when the
# App Store Connect key secrets exist) uploads it straight to App Store Connect.
# It stays skipped until these repository secrets are added (see
# APP_STORE_SUBMISSION.md for how each value is produced):
#   APP_STORE_CERT_P12_BASE64       base64 of the Apple Distribution .p12
#   APP_STORE_CERT_PASSWORD         password used when exporting the .p12
#   APP_STORE_PROFILE_BASE64        base64 of the App Store Connect .mobileprovision
#   APP_STORE_TEAM_ID               Apple Developer Team ID (10 chars)
#   APP_STORE_CONNECT_KEY_P8_BASE64 base64 of AuthKey_<ID>.p8 (App Store Connect API)
#   APP_STORE_CONNECT_KEY_ID        the Key ID of that .p8
#   APP_STORE_CONNECT_ISSUER_ID     the Issuer UUID from App Store Connect API page
#
# Both iOS builds strip the Mac-only dependency_overrides (Firebase 10.x pins for
# the local Xcode 15.2) so pub resolves the modern versions. The release .ipa
# stays unsigned (re-signed by AltStore/Sideloadly at install); only the
# `ios_appstore` artifact is signed for App Store distribution.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Android signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from pubspec
        run: |
          echo "VERSION=$(sed -nE 's/^version: ([0-9.]+).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Strip Mac-only dependency overrides
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          s = re.sub(r'(?ms)^dependency_overrides:.*?(?=^\S)', '', s)
          p.write_text(s)
          assert 'dependency_overrides' not in s, 'failed to strip overrides'
          PY

      - name: Check keystore secret
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 repository secret (see workflow header)."
            exit 1
          fi

      - name: Restore Android signing keystore
        run: |
          set -eux
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          set -eux
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk kindred.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindred-apk
          path: kindred.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from pubspec
        run: |
          echo "VERSION=$(sed -nE 's/^version: ([0-9.]+).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Strip Mac-only dependency overrides
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          s = re.sub(r'(?ms)^dependency_overrides:.*?(?=^\S)', '', s)
          p.write_text(s)
          assert 'dependency_overrides' not in s, 'failed to strip overrides'
          PY

      - name: Fresh pods
        run: rm -rf ios/Pods ios/Podfile.lock

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -eux
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry Kindred-${{ env.VERSION }}-unsigned.ipa Payload
          ls -la Kindred-${{ env.VERSION }}-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kindred-unsigned-ipa
          path: build/ios/iphoneos/Kindred-${{ env.VERSION }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  ios_appstore:
    name: iOS App Store IPA
    runs-on: macos-latest
    # Builds a SIGNED App Store IPA. No-ops (fast) until the App Store signing
    # secrets exist — `secrets` can't be used in a job-level `if`, so the first
    # step guards everything after it instead.
    steps:
      - name: Check App Store secrets are present
        id: guard
        env:
          CERT_P12_BASE64: ${{ secrets.APP_STORE_CERT_P12_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          # `secrets` is banned in job/step `if:` expressions — read them via env here
          # and expose booleans as step outputs instead.
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store signing secrets not set yet - skipping the App Store build (see APP_STORE_SUBMISSION.md)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ -n "$ASC_KEY_P8_BASE64" ]; then
              echo "upload=true" >> "$GITHUB_OUTPUT"
            else
              echo "upload=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Build will run, but upload to App Store Connect is off (ASC API key secret missing)."
            fi
          fi

      - name: Checkout
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Version from pubspec
        if: steps.guard.outputs.skip == 'false'
        run: |
          echo "VERSION=$(sed -nE 's/^version: ([0-9.]+).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        if: steps.guard.outputs.skip == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Strip Mac-only dependency overrides
        if: steps.guard.outputs.skip == 'false'
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('pubspec.yaml')
          s = p.read_text()
          s = re.sub(r'(?ms)^dependency_overrides:.*?(?=^\S)', '', s)
          p.write_text(s)
          assert 'dependency_overrides' not in s, 'failed to strip overrides'
          PY

      - name: Fresh pods
        if: steps.guard.outputs.skip == 'false'
        run: rm -rf ios/Pods ios/Podfile.lock

      - name: Pub get
        if: steps.guard.outputs.skip == 'false'
        run: flutter pub get

      - name: Import distribution certificate + profile
        if: steps.guard.outputs.skip == 'false'
        env:
          CERT_P12_BASE64: ${{ secrets.APP_STORE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APP_STORE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APP_STORE_PROFILE_BASE64 }}
        run: |
          set -eux
          KEYCHAIN=$RUNNER_TEMP/appstore.keychain-db
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          # must run AFTER the import: newer macOS errors on an empty keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          # later steps need to re-unlock the keychain and find the profile by name
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PW=$KEYCHAIN_PW" >> "$GITHUB_ENV"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/dist.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$(uuidgen).mobileprovision"

      - name: Generate ExportOptions.plist
        if: steps.guard.outputs.skip == 'false'
        env:
          TEAM_ID: ${{ secrets.APP_STORE_TEAM_ID }}
        run: |
          set -eux
          # The profile's own Name is what Xcode expects in provisioningProfiles
          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" | plutil -extract Name raw -)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.jonahb344.kindred</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build App Store IPA
        if: steps.guard.outputs.skip == 'false'
        env:
          TEAM_ID: ${{ secrets.APP_STORE_TEAM_ID }}
        # GITHUB_RUN_NUMBER is unique + increasing, which is exactly what
        # App Store Connect requires for CFBundleVersion. The pbxproj has no
        # DEVELOPMENT_TEAM, so `flutter build ipa` (automatic signing) cannot
        # find an identity — archive manually with the imported cert/profile.
        run: |
          set -eux
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Signing settings must live on the Runner target ONLY. Passing them as
          # xcodebuild overrides applies them to every SPM package / CocoaPod target
          # too, which fails with "<target> does not support provisioning profiles".
          python3 - "$TEAM_ID" "$PROFILE_NAME" <<'PYEOF'
          import sys
          team, profile = sys.argv[1], sys.argv[2]
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          src = open(path).read()
          needle = 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;'
          assert src.count(needle) == 3, f'expected 3 Runner configs, found {src.count(needle)}'
          inject = (needle + '\n\t\t\t\tCODE_SIGN_STYLE = Manual;'
                    + f'\n\t\t\t\tDEVELOPMENT_TEAM = {team};'
                    + '\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
                    + f'\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";')
          open(path, 'w').write(src.replace(needle, inject))
          PYEOF
          flutter build ios --release --no-codesign --build-number=$GITHUB_RUN_NUMBER
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/Runner.xcarchive" archive
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa"

      - name: Upload App Store IPA artifact
        if: steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kindred-appstore-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to App Store Connect
        if: steps.guard.outputs.upload == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -eux
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          KEYFILE=$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEYFILE"
          chmod 600 "$KEYFILE"
          # altool is deprecated but still the simplest uploader; fall back to
          # Transporter (iTMSTransporter) if a future Xcode removes it.
          if xcrun altool --help >/dev/null 2>&1; then
            xcrun altool --upload-app -f "$IPA" -t ios \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --keyfile "$KEYFILE"
          else
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            cp "$KEYFILE" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            xcrun iTMSTransporter -m upload -assetFile "$IPA" \
              -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v error
          fi

  release:
    name: Publish release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release names
        run: |
          VERSION=$(sed -nE 's/^version: ([0-9.]+).*/\1/p' pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=v$VERSION
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kindred-apk
          path: kindred-apk

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Kindred-unsigned-ipa
          path: Kindred-unsigned-ipa

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Kindred ${{ env.TAG }}
          body: |
            Automatic release built by GitHub Actions.

            - **Android**: `kindred.apk` (signed with the production keystore) — install directly or via the README button.
            - **iOS**: `Kindred-${{ env.VERSION }}-unsigned.ipa` — sideload with AltStore/Sideloadly (unsigned by design; AltStore signs it on install). Refresh via the AltStore source at `https://kindred.jonahb344.workers.dev/altstore.json`.
          files: |
            kindred-apk/kindred.apk
            Kindred-unsigned-ipa/Kindred-${{ env.VERSION }}-unsigned.ipa
          fail_on_unmatched_files: true